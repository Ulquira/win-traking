name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_PEBBLE_0F52D5A0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "dist"
        env:
          VITE_API_URL: "https://trakingwin-api-eus.azurewebsites.net"
          VITE_GOOGLE_MAPS_API_KEY: "AIzaSyA9aYa76-YBAGlanLejHQ55ipqUxX4vkd8"
          VITE_API_TOKEN: "LLAVE_SECRETA_DEL_TERCERO_123"
          VITE_FIREBASE_API_KEY: "AIzaSyAXszU1L5M-1H73V94vwWvoMQ7buzsAOkc"
          VITE_FIREBASE_AUTH_DOMAIN: "dynamic-radar-470920-g9.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "dynamic-radar-470920-g9"
          VITE_FIREBASE_STORAGE_BUCKET: "dynamic-radar-470920-g9.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "890927779001"
          VITE_FIREBASE_APP_ID: "1:890927779001:web:caba1676ca6e01ec225f68"
          VITE_FIREBASE_MEASUREMENT_ID: "G-PJ9989CHGF"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_PEBBLE_0F52D5A0F }}
          action: "close"