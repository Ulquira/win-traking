# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
name: Build and deploy Node.js app to Azure Web App - trakingwin-api-eus

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install production dependencies and zip
        run: |
          npm install --omit=dev
          zip -r release.zip package.json package-lock.json tsconfig*.json server capa_intermedia node_modules -q

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FECAF0ECFE2149689688FBEEB9776F51 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4786C3E549D143D084B807109F01FCC0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E6520A1A2CFA4142B1570C42C07A2713 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'trakingwin-api-eus'
          slot-name: 'Production'
          package: release.zip